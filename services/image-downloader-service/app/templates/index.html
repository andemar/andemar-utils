<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --danger-light: #fef2f2;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-focus: #3b82f6;
            --secondary-btn: #475569;
            --secondary-btn-hover: #334155;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            padding: 11px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-main);
            width: 100%;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Folder Input with Browse Button */
        .folder-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .folder-input-wrapper input {
            flex: 1;
        }

        .btn-browse {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 16px;
            background: var(--secondary-btn);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-browse:hover {
            background: var(--secondary-btn-hover);
        }

        .btn-browse:active {
            transform: scale(0.98);
        }

        .btn-browse:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row > div {
            flex: 1;
        }

        /* Action Buttons Row */
        .actions-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            width: 100%;
            margin-top: 6px;
        }

        .btn-download {
            flex: 1;
            padding: 13px 20px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        .btn-download:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-download:active {
            transform: translateY(1px);
        }

        .btn-clear {
            width: 15%;
            min-width: 48px;
            padding: 13px 0;
            background: var(--danger);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        .btn-clear:hover {
            background: var(--danger-hover);
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
        }

        .btn-clear:active {
            transform: scale(0.96);
        }

        /* SVG Icons */
        .icon {
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        /* Status Messages */
        .message {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f0fdf4;
            color: #166534;
            border-left: 4px solid #22c55e;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error {
            margin-top: 24px;
            padding: 14px 16px;
            background: #fef2f2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Terminal Logs */
        .logs-card {
            margin-top: 24px;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .logs-header {
            background: #1e293b;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logs-body {
            padding: 14px 16px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 240px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
        }

        .log-bullet {
            color: #38bdf8;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>
            <svg class="icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            Manga Downloader
        </h1>
        <p>Batch download manga chapters directly to your local computer</p>
    </div>
    
    <form id="download_form" action="/download" method="POST">
        <div class="form-group">
            <label for="url">Manga URL</label>
            <input type="text" id="url" name="url" value="{{ url or '' }}" placeholder="https://mockmanga.com/manga/adventure" required>
        </div>
        
        <div class="form-group">
            <label for="save_folder">Save Folder (Local Absolute Path)</label>
            <div class="folder-input-wrapper">
                <input type="text" id="save_folder" name="save_folder" value="{{ save_folder or '' }}" placeholder="C:\MangaDownloads or /Users/name/Manga" required>
                <button type="button" id="browse_folder_btn" class="btn-browse" title="Open File Explorer to select folder">
                    <svg class="icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span id="browse_btn_text">Browse</span>
                </button>
            </div>
        </div>
        
        <div class="row">
            <div class="form-group">
                <label for="start_chapter">Start Chapter (Optional)</label>
                <input type="text" id="start_chapter" name="start_chapter" value="{{ start_chapter or '' }}" placeholder="001">
            </div>
            <div class="form-group">
                <label for="end_chapter">End Chapter (Optional)</label>
                <input type="text" id="end_chapter" name="end_chapter" value="{{ end_chapter or '' }}" placeholder="003">
            </div>
        </div>
        
        <div class="actions-row">
            <button type="submit" id="download_btn" class="btn-download">
                <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span id="download_btn_text">Download</span>
            </button>
            <button type="button" id="clear_btn" class="btn-clear" title="Clear all inputs">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </form>

    {% if message %}
    <div class="message">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>{{ message }}</span>
    </div>
    {% endif %}

    {% if error %}
    <div class="error">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    {% if logs %}
    <div class="logs-card">
        <div class="logs-header">
            <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            Execution Logs
        </div>
        <div class="logs-body">
            {% for log in logs %}
            <div class="log-entry">
                <span class="log-bullet">&gt;</span>
                <span>{{ log }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>

<script>
    // Elements
    const urlInput = document.getElementById('url');
    const folderInput = document.getElementById('save_folder');
    const startInput = document.getElementById('start_chapter');
    const endInput = document.getElementById('end_chapter');
    const form = document.getElementById('download_form');
    const downloadBtn = document.getElementById('download_btn');
    const downloadBtnText = document.getElementById('download_btn_text');
    const clearBtn = document.getElementById('clear_btn');
    const browseBtn = document.getElementById('browse_folder_btn');
    const browseBtnText = document.getElementById('browse_btn_text');

    // Restore from localStorage if field was not prefilled by server
    if (!urlInput.value && localStorage.getItem('manga_url')) {
        urlInput.value = localStorage.getItem('manga_url');
    }
    if (!folderInput.value && localStorage.getItem('manga_save_folder')) {
        folderInput.value = localStorage.getItem('manga_save_folder');
    }
    if (!startInput.value && localStorage.getItem('manga_start_chapter')) {
        startInput.value = localStorage.getItem('manga_start_chapter');
    }
    if (!endInput.value && localStorage.getItem('manga_end_chapter')) {
        endInput.value = localStorage.getItem('manga_end_chapter');
    }

    // Always keep localStorage updated
    function syncToStorage() {
        if (urlInput.value) localStorage.setItem('manga_url', urlInput.value);
        if (folderInput.value) localStorage.setItem('manga_save_folder', folderInput.value);
        if (startInput.value) localStorage.setItem('manga_start_chapter', startInput.value);
        if (endInput.value) localStorage.setItem('manga_end_chapter', endInput.value);
    }
    [urlInput, folderInput, startInput, endInput].forEach(el => {
        el.addEventListener('input', syncToStorage);
    });

    // 1. When Download is submitted, preserve inputs
    form.addEventListener('submit', function() {
        syncToStorage();
        downloadBtnText.textContent = 'Downloading...';
        downloadBtn.style.opacity = '0.85';
    });

    // 2. Clear button (red garbage icon, 15% width) - cleans all 4 inputs
    clearBtn.addEventListener('click', function(e) {
        e.preventDefault();
        urlInput.value = '';
        folderInput.value = '';
        startInput.value = '';
        endInput.value = '';
        localStorage.removeItem('manga_url');
        localStorage.removeItem('manga_save_folder');
        localStorage.removeItem('manga_start_chapter');
        localStorage.removeItem('manga_end_chapter');
        urlInput.focus();
    });

    // 3. Open native File Explorer to select folder
    browseBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        const currentFolder = folderInput.value.trim();
        browseBtn.disabled = true;
        const originalText = browseBtnText.textContent;
        browseBtnText.textContent = 'Selecting...';
        
        try {
            const response = await fetch(`/api/select-folder?initial_dir=${encodeURIComponent(currentFolder)}`);
            if (response.ok) {
                const data = await response.json();
                if (data && data.path) {
                    folderInput.value = data.path;
                    localStorage.setItem('manga_save_folder', data.path);
                }
            } else {
                console.error('Server returned error while opening folder picker');
            }
        } catch (error) {
            console.error('Error contacting folder selection API:', error);
        } finally {
            browseBtn.disabled = false;
            browseBtnText.textContent = originalText;
        }
    });
</script>

</body>
</html>
